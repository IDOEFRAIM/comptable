# Sert le bundle Angular + relaie /api vers le backend Spring Boot - equivalent en production de
# proxy.conf.json utilise en developpement (meme prefixe /api, meme cible logique).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/manifest+json text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # index.html ne doit jamais etre mis en cache : c'est lui qui reference les fichiers JS/CSS
    # hashes par build, un cache perime pointerait vers des assets qui n'existent plus apres un
    # nouveau deploiement.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # PWA : le service worker, sa liste de fichiers et le manifeste doivent TOUJOURS etre revalides, sinon une
    # nouvelle version de l'application ne serait jamais detectee (un cache d'un an sur ngsw-worker.js la figerait).
    # Ces blocs "=" l'emportent sur la regle generique des fichiers .js plus bas.
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
    }
    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache";
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }
    # Logos et icones : noms non hashes, donc revalidation (ETag) plutot qu'un cache d'un an.
    location ^~ /assets/ {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA : toute route cote client (ex: /entreprises/xxx/documents) qui ne correspond
    # a aucun fichier statique retombe sur index.html, Angular Router prend le relai.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets Angular hashes (main-XXXX.js, styles-XXXX.css...) : cache long, le hash change des
    # que le contenu change, jamais de risque de servir une version perimee.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BACKEND_UPSTREAM injecte au demarrage du conteneur (voir docker-entrypoint scripts nginx
    # standard : les fichiers /etc/nginx/conf.d/*.conf sont traites par envsubst automatiquement
    # sur l'image nginx officielle uniquement pour les variables explicitement whitelistees ; ici
    # on utilise resolver + variable pour permettre au nom "backend" d'etre resolu dynamiquement
    # par Docker au lieu d'etre foge au build).
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_upstream http://backend:8081;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
