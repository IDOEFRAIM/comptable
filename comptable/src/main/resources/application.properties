spring.application.name=comptable

# La datasource est auto-configuree par spring-boot-docker-compose a partir de compose.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Imports volumineux (releves de milliers de lignes) : les insertions et mises a jour partent par paquets, jamais une par ligne.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.flyway.enabled=true

# Les ResponseStatusException(...) portent des messages deliberement destines a l'utilisateur
# (ex: "montants incoherents"), jamais des details internes : sans ceci ils sont masques par defaut.
# Spring Boot 4 : la propriete a ete deplacee (server.error.include-message est depreciee et n'a plus d'effet) ; sans elle, AUCUN message de ResponseStatusException
# n'atteignait l'interface (« Impossible de cloturer cet exercice » au lieu de la liste des bloquants) - constate au test navigateur de la phase E.
spring.web.error.include-message=always
server.port=8081
security.jwt.secret=${JWT_SECRET:changeit-dev-secret-changeit-dev-secret-32B}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

storage.documents.root-dir=${DOCUMENTS_STORAGE_DIR:./data/documents}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Extraction par IA (Sprint 1) : desactivee par defaut, HeuristiqueOcrExtractionService reste
# actif tant que ce flag est a false. Une fois a true, AiServiceOcrExtractionService delegue
# l'extraction au microservice IA (ai-service.base-url ci-dessous) au lieu d'un appel local.
agent.vlm.enabled=${AGENT_VLM_ENABLED:true}

# Microservice IA (ai-service, FastAPI) : toute la logique IA (extraction VLM, analyse visuelle
# de fraude, rapprochement semantique, envoi de templates WhatsApp) vit desormais la-bas - voir
# ../ai-service. Ce module Spring Boot n'appelle plus Anthropic/Ollama directement.
#
# base-url / outbound-api-key : utilises par AiServiceClient pour les appels sortants
# (extraction, fraude visuelle, rapprochement, envoi WhatsApp) vers ai-service. outbound-api-key
# doit etre identique a INTERNAL_API_KEY cote ai-service/.env.
ai-service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai-service.outbound-api-key=${AI_SERVICE_OUTBOUND_API_KEY:devsecret-outbound-2026}
# Timeouts des appels sortants (extraction, fraude, rapprochement, matching, envoi WhatsApp) :
# le Universal Matching Engine peut appeler Claude, donc un read-timeout plus genereux que le
# defaut HTTP habituel. Un depassement degrade toujours vers AI_UNAVAILABLE (AiServiceClient),
# jamais une exception qui remonterait jusqu'a l'utilisateur.
ai-service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:5000}
ai-service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:130000}
#
# api-key : cle verifiee par WhatsAppInternalIngestionController sur
# POST /api/v1/internal/whatsapp/documents (header X-Internal-Api-Key), pour l'appel entrant
# depuis ai-service une fois une piece WhatsApp extraite et analysee de son cote. Doit etre
# identique a CORE_SERVICE_API_KEY cote ai-service/.env. Vide par defaut : tant que non
# renseignee, la comparaison echoue toujours (401), l'endpoint reste ferme meme si un attaquant
# devine l'URL.
ai-service.api-key=${AI_SERVICE_API_KEY:}

# Relance automatique des pieces en retard (Sprint 5). Desactivee par defaut : sans un template
# WhatsApp approuve par Meta (nom exact ci-dessous, cree dans Meta Business Manager) et un
# phone-number-id valide cote ai-service, chaque tentative echouerait simplement et alimenterait
# l'historique en ECHEC - ce flag evite de faire tourner le job pour rien tant que ce n'est pas
# configure. L'envoi effectif (config Meta Graph API) est desormais cote ai-service/.env.
relance.enabled=${RELANCE_ENABLED:false}
relance.cron=${RELANCE_CRON:0 0 8 * * *}
relance.template-name=${RELANCE_TEMPLATE_NAME:relance_pieces_comptables}
relance.template-language=${RELANCE_TEMPLATE_LANGUAGE:fr}

# Rapprochement semantique Mobile Money (Sprint 6) : filet de secours par IA sur les lignes de
# releve que l'appariement par montant exact n'a pas su resoudre (RapprochementBancaireService).
# Desactive par defaut, comme agent.vlm.enabled. Le seuil de confiance est desormais configure
# cote ai-service (RAPPROCHEMENT_SEUIL_CONFIANCE) : c'est la-bas que le filtrage a lieu.
agent.rapprochement-semantique.enabled=${AGENT_RAPPROCHEMENT_SEMANTIQUE_ENABLED:false}

# Universal Matching Engine (mission 2) : filet de secours multi-source (ecritures, factures
# clients, pieces fournisseur/documents) sur les lignes que le rapprochement deterministe ET le
# rapprochement semantique (ci-dessus, banque<->ecritures uniquement) n'ont pas su resoudre.
# Desactive par defaut comme les autres fonctionnalites IA de ce module. auto-match-threshold /
# review-threshold : mêmes valeurs par defaut que matching_auto_match_threshold /
# matching_review_threshold cote ai-service - alignees mais gardees distinctes (MatchDecisionEngine
# revalide independamment, ne fait jamais confiance au seul jugement d'ai-service).
agent.matching-ia.enabled=${AGENT_MATCHING_IA_ENABLED:false}
agent.matching.auto-match-threshold=${AGENT_MATCHING_AUTO_MATCH_THRESHOLD:0.95}
agent.matching.review-threshold=${AGENT_MATCHING_REVIEW_THRESHOLD:0.70}

# Mission P0 "Core Intelligent" : proposition de comptabilisation Document -> Ecriture
# (agent.comptabilisation.AccountingProposalBuilder), heuristique Java pure (historique tiers/
# compte), jamais un appel LLM. Desactive par defaut comme les autres fonctionnalites IA de ce
# module. Le Niveau 3 (auto-application reelle) reste en outre reserve au canal WhatsApp
# (agent.pipeline.EcritureNode), meme quand ce flag est actif.
agent.accounting-proposal.enabled=${AGENT_ACCOUNTING_PROPOSAL_ENABLED:false}

# Agent controleur de fraude et d'anomalies fiscales (Sprint 7). Les controles deterministes
# (ecart de TVA, montant rond suspect, doublon strict) tournent toujours en Java, gratuits et
# sans appel reseau. Seule l'analyse visuelle du recu (VLM, deleguee a ai-service) est derriere
# un flag, desactivee par defaut comme les autres fonctionnalites IA de ce module.
agent.fraude.analyse-visuelle.enabled=${AGENT_FRAUDE_ANALYSE_VISUELLE_ENABLED:false}
# Taux de TVA standard UEMOA (18%) utilise pour detecter un ecart grossier entre le HT et la TVA
# declares ; tolerance en XOF pour absorber les arrondis legitimes.
agent.fraude.tva.taux-standard=${AGENT_FRAUDE_TVA_TAUX_STANDARD:0.18}
agent.fraude.tva.tolerance-xof=${AGENT_FRAUDE_TVA_TOLERANCE_XOF:200}
# Fenetre (+/- jours) de recherche de doublon strict autour de la date de la piece.
agent.fraude.doublon.fenetre-jours=${AGENT_FRAUDE_DOUBLON_FENETRE_JOURS:3}
# Un montant TTC multiple exact de cette valeur sur un achat/recu declenche une alerte "montant
# rond suspect" (indice de facture de complaisance, jamais une preuve a lui seul).
agent.fraude.montant-rond.multiple-xof=${AGENT_FRAUDE_MONTANT_ROND_MULTIPLE_XOF:5000}

# --- Telepaiement fiscal (module fiscalite.paiement) ---------------------------------------------
# Paiement direct des declarations fiscales aupres de fournisseurs externes propres au Burkina
# Faso : e-Syntaxe (DGI, teledeclaration/telepaiement des impots) et Faso Arzeka (La Poste BF,
# mobile money - notamment CNPS). Aucune des deux API n'est accessible a ce jour (pas d'acces
# obtenu aupres de la DGI / La Poste BF) : mode=simulation par defaut, qui ne contacte aucun
# service externe et fabrique une reference locale a confirmer via
# POST .../paiements/{id}/simuler-confirmation (voir PaiementFiscalController). Voir
# EsyntaxeTaxPaymentProvider / FasoArzekaTaxPaymentProvider pour la marche a suivre une fois l'acces
# obtenu : renseigner base-url/api-key ci-dessous, implementer appellerApiReelle, puis mode=reel.
esyntaxe.mode=${ESYNTAXE_MODE:simulation}
esyntaxe.base-url=${ESYNTAXE_BASE_URL:}
esyntaxe.api-key=${ESYNTAXE_API_KEY:}

fasoarzeka.mode=${FASOARZEKA_MODE:simulation}
fasoarzeka.base-url=${FASOARZEKA_BASE_URL:}
fasoarzeka.api-key=${FASOARZEKA_API_KEY:}

# Cle partagee attendue sur le header X-Webhook-Api-Key du webhook de confirmation asynchrone
# (POST /api/webhooks/paiements/{fournisseur}, voir PaiementWebhookController). Vide par defaut :
# tant que non renseignee, le webhook rejette tout appel (401) - pas de risque qu'un tiers confirme
# un paiement fiscal sans cle, meme avant que l'integration reelle ne soit branchee.
paiement.webhook.api-key=${PAIEMENT_WEBHOOK_API_KEY:}


# --- Exploitation (pilote) ------------------------------------------------------------------------------------------------
# Chaque ligne de journal porte l'identifiant de corrélation, le tenant et l'utilisateur (voir CorrelationIdFilter / AccessLogFilter) : aucun mot de passe, jeton ni document n'est journalisé.
logging.pattern.level=%5p [%X{correlationId:-}|t=%X{tenant:-}|u=%X{user:-}]
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Mode d'inscription d'un cabinet : OPEN (développement / tests) ou PROVISIONING (pilote, production : jeton d'approvisionnement de l'opérateur obligatoire).
comptable.registration.mode=${COMPTABLE_REGISTRATION_MODE:OPEN}
comptable.provisioning.token=${COMPTABLE_PROVISIONING_TOKEN:}
# Politique de connexion : verrouillage du compte après N échecs consécutifs pendant M minutes ; validité d'un jeton de réinitialisation (heures).
# debits maximaux par adresse (voir AuthService) ; ne les relever que pour les tests automatises
security.rate.login-max=${RATE_LOGIN_MAX:30}
security.rate.reset-max=${RATE_RESET_MAX:10}
security.rate.register-max=${RATE_REGISTER_MAX:10}
security.login.max-echecs=${LOGIN_MAX_ECHECS:5}
security.login.verrou-minutes=${LOGIN_VERROU_MINUTES:15}
security.reset.validite-heures=${RESET_VALIDITE_HEURES:24}
