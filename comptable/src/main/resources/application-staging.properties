# Profil STAGING (SPRING_PROFILES_ACTIVE=staging) : même rigueur de secrets que la production, mais jamais de message réel à un vrai client.
spring.docker.compose.enabled=false
spring.jpa.show-sql=false
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
comptable.registration.mode=${COMPTABLE_REGISTRATION_MODE:PROVISIONING}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,storage,migrations
# Les envois (WhatsApp) ne partent que vers les numéros listés dans COLLECTE_SANDBOX_ALLOWLIST ; vide = AUCUN envoi autorisé tant que la liste n'est pas renseignée.
collecte.sandbox.allowlist=${COLLECTE_SANDBOX_ALLOWLIST:000}
