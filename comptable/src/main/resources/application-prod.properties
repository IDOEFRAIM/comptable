# Profil PRODUCTION (SPRING_PROFILES_ACTIVE=prod). Aucune valeur secrète ici : tout vient de l'environnement. Le démarrage est REFUSÉ si une configuration critique est faible ou absente
# (voir ProductionStartupValidator).
spring.docker.compose.enabled=false
spring.jpa.show-sql=false
logging.level.root=INFO
logging.level.com.example.comptable=INFO
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.forward-headers-strategy=framework
# Inscription de cabinet réservée à l'opérateur (jeton d'approvisionnement).
comptable.registration.mode=${COMPTABLE_REGISTRATION_MODE:PROVISIONING}
# Seul l'état est exposé : sondes liveness / readiness, aucun détail.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db,storage,migrations
