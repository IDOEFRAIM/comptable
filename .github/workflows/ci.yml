name: CI

on:
  push:
    branches: [main, master, spring]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: comptable
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: comptable/frontend/package-lock.json
      - name: npm ci
        working-directory: comptable/frontend
        run: npm ci
      - name: Production build
        working-directory: comptable/frontend
        run: npx ng build --configuration production
      - name: Tests unitaires (Karma / Jasmine, Chrome headless)
        working-directory: comptable/frontend
        run: npm test

  e2e:
    name: E2E critiques (Playwright, PostgreSQL réel)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: mydatabase
          POSTGRES_USER: myuser
          POSTGRES_PASSWORD: ci-e2e-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U myuser -d mydatabase" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mydatabase
      SPRING_DATASOURCE_USERNAME: myuser
      SPRING_DATASOURCE_PASSWORD: ci-e2e-only
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: comptable/frontend/package-lock.json
      - name: npm ci
        working-directory: comptable/frontend
        run: npm ci
      - name: Wrapper Maven exécutable (lancé par Playwright pour démarrer le backend)
        run: chmod +x comptable/mvnw
      - name: Suite Playwright complète (pilote, cabinet, dossier financier, TVA, responsive / accessibilité)
        working-directory: comptable/frontend
        run: npx playwright test
      - name: Rapports Playwright en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: comptable/frontend/test-results
          retention-days: 7

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: Sync deps
        working-directory: ai-service
        run: uv sync
      - name: pytest
        working-directory: ai-service
        run: uv run pytest -q

  docker-build:
    name: Images Docker (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, ai-service]
    steps:
      - uses: actions/checkout@v4
      - name: Dummy .env (les valeurs ne servent qu'a l'interpolation compose au build)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/;s/^JWT_SECRET=$/JWT_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/;s/^AI_SERVICE_OUTBOUND_API_KEY=$/AI_SERVICE_OUTBOUND_API_KEY=ci/;s/^AI_SERVICE_INBOUND_API_KEY=$/AI_SERVICE_INBOUND_API_KEY=ci/;s/^COMPTABLE_PROVISIONING_TOKEN=$/COMPTABLE_PROVISIONING_TOKEN=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/;s#^COLLECTE_LIEN_DEPOT_BASE_URL=$#COLLECTE_LIEN_DEPOT_BASE_URL=https://ci.example.org/depot#' .env
      - name: Build all images
        run: docker compose build
