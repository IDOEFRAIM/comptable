name: CI

on:
  push:
    branches: [main, master, spring]
  pull_request:

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify
        working-directory: comptable
        run: ./mvnw -B -ntp verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: comptable/frontend/package-lock.json
      - name: npm ci
        working-directory: comptable/frontend
        run: npm ci
      - name: Production build
        working-directory: comptable/frontend
        run: npx ng build --configuration production

  ai-service:
    name: AI service (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pipx install uv
      - name: Sync deps
        working-directory: ai-service
        run: uv sync
      - name: pytest
        working-directory: ai-service
        run: uv run pytest -q

  docker-build:
    name: Images Docker (build only)
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    steps:
      - uses: actions/checkout@v4
      - name: Dummy .env (les valeurs ne servent qu'a l'interpolation compose au build)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/;s/^JWT_SECRET=$/JWT_SECRET=ci-ci-ci-ci-ci-ci-ci-ci-ci-ci-ci/;s/^AI_SERVICE_OUTBOUND_API_KEY=$/AI_SERVICE_OUTBOUND_API_KEY=ci/;s/^AI_SERVICE_INBOUND_API_KEY=$/AI_SERVICE_INBOUND_API_KEY=ci/' .env
      - name: Build all images
        run: docker compose build
