[project]
name = "app"
version = "0.1.0"
description = "Microservice IA (extraction VLM, WhatsApp, fraude, rapprochement semantique) pour le SaaS comptable"
requires-python = ">=3.12,<4.0.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "anthropic>=0.40",
    "groq>=0.11",
    "python-multipart>=0.0.12",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "langgraph (>=1.2.11,<2.0.0)",
    "tenacity (==9.1.4)",
    "mcp (>=2.1.1,<3.0.0)",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
